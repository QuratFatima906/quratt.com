name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight — except on main, where every commit gets a
# real result because that is what production deploys from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Pages that read content are prerendered, so the database is primarily a build dependency.
    # The e2e job needs one too, but only to answer requests for paths that were never
    # prerendered; Lighthouse only visits prerendered pages and needs none.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quratt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quratt

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      # Seeding twice must not duplicate a row. The seeder prints the length of its input
      # arrays, so it reports the same numbers either way — only a count against the tables
      # can tell, which is what `check:seed` does.
      - name: Seed is idempotent
        run: pnpm db:seed && pnpm check:seed
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          # `.next` is a dotted directory, so every path under it counts as hidden and is
          # skipped unless this is set. Without `error`, an empty upload only warns and the
          # job goes green while producing nothing — which is how this failed the first time.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: build
    # Takes ~4 min. The ceiling is the backstop, not the fix: `install-deps` is bounded and
    # retried below, so a stalled apt mirror can cost at most ~9 min instead of the whole job.
    # This stays because GitHub's default is six hours, and a job that hangs some other way
    # should still stop.
    timeout-minutes: 20

    # Most routes are prerendered and need nothing at request time, but a path outside
    # `generateStaticParams` — a markdown twin that does not exist, for instance — renders on
    # demand and reaches the database. `cacheComponents` rules out both `dynamic` and
    # `dynamicParams`, so the server genuinely needs a database to answer that 404 honestly.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quratt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quratt

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Browser binaries are large and change only when Playwright does, so key the cache
      # on the resolved version rather than the lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls @playwright/test --depth 0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].devDependencies["@playwright/test"].version))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Browsers only — no apt. Skipped entirely when the cache hits.
      - run: pnpm exec playwright install chromium webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # The system libraries webkit needs are not on the runner image and cannot be cached:
      # they land in /usr, not in `~/.cache/ms-playwright`. So this runs every time, and it
      # is the only unbounded step in the job — `install-deps` shells out to apt, which has
      # no timeout of its own.
      #
      # On 2026-08-19 it stalled 18 minutes: every `azure.archive.ubuntu.com` mirror returned
      # `Ign`, it fell back to `archive.ubuntu.com`, and sat there until the job's own
      # 20-minute ceiling cancelled it. A re-run of the same commit passed in 4m15s. That is
      # the second time this has hung — the first burned 28 minutes before the ceiling existed.
      #
      # Bounded and retried, a stalled mirror now costs three minutes and a fresh attempt
      # rather than the whole job. The apt lists are cleared between tries so the retry
      # re-resolves rather than sitting on the same dead mirror.
      - name: Install Playwright system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 180 pnpm exec playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::playwright install-deps attempt $attempt failed or timed out; retrying"
            sudo rm -rf /var/lib/apt/lists/*
          done
          echo "::error::playwright install-deps failed three times; apt is unreachable"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      # The prerendered pages carry their own content; this is only for the on-demand paths.
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm dlx @lhci/cli@0.15.x autorun

      # P7's budgets are written for "a mobile-throttled trace", and the run above is the
      # desktop preset — so on its own it never measured the thing the phase asked for.
      # `devtools` throttling rather than the default `simulate`: the simulator models a
      # dependency graph and put LCP 650 ms above what applying the throttling actually
      # produces, which is too wide a gap to gate on.
      #
      # Its thresholds are deliberately looser than the desktop run's. This is a shared
      # runner: TBT measured 67-96 ms locally and 183 ms here, and the same commit failed
      # and then passed on a re-run. LCP and CLS are the stable pair and stay strict — LCP
      # is what this gate exists to protect. The composite score is a weighted function of
      # the noisy metric, so it is asserted on the desktop run only.
      - name: Performance budgets (mobile)
        run: pnpm dlx @lhci/cli@0.15.x autorun --config=lighthouserc.mobile.json

      # The JS budget that matters is how much of the bundle is ours, which Lighthouse cannot
      # tell us — it only sees the total, most of which is framework.
      - name: JavaScript budget
        run: |
          pnpm start &
          npx --yes wait-on http://localhost:3000 -t 60000
          node scripts/check-bundle.mjs
