name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight — except on main, where every commit gets a
# real result because that is what production deploys from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: Build
    runs-on: ubuntu-latest

    # Pages that read content are prerendered, so the database is primarily a build dependency.
    # The e2e job needs one too, but only to answer requests for paths that were never
    # prerendered; Lighthouse only visits prerendered pages and needs none.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quratt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quratt

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          # `.next` is a dotted directory, so every path under it counts as hidden and is
          # skipped unless this is set. Without `error`, an empty upload only warns and the
          # job goes green while producing nothing — which is how this failed the first time.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: build

    # Most routes are prerendered and need nothing at request time, but a path outside
    # `generateStaticParams` — a markdown twin that does not exist, for instance — renders on
    # demand and reaches the database. `cacheComponents` rules out both `dynamic` and
    # `dynamicParams`, so the server genuinely needs a database to answer that 404 honestly.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quratt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quratt

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Browser binaries are large and change only when Playwright does, so key the cache
      # on the resolved version rather than the lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls @playwright/test --depth 0 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].devDependencies["@playwright/test"].version))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium webkit
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      # The prerendered pages carry their own content; this is only for the on-demand paths.
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm dlx @lhci/cli@0.15.x autorun
